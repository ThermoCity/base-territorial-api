spring.application.name=base-territorial-api

# ---------- Banco de dados (PostgreSQL) ----------
# validate: a API so confere o esquema; quem cria as tabelas TMC_ e o repositorio do banco.
# Defina as variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD (nunca coloque senha no codigo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/base_territorial}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Compressao gzip das respostas JSON (o GeoJSON dos setores tem ~600 KB)
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json
server.compression.min-response-size=2KB

# Listas paginadas (GET /simulacoes): no maximo 100 itens por pagina.
spring.data.web.pageable.max-page-size=100

# Origens do navegador que podem chamar a API (painel do gemeo digital). Separadas por virgula.
thermocity.cors.origens=${CORS_ORIGENS:http://localhost:5173,https://thermocity-gemeo-front.vercel.app}

# Insercoes em lote: a geracao do cadastro sintetico grava milhares de linhas de uma vez.
# reWriteBatchedInserts junta os INSERTs do lote num so comando no PostgreSQL.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Upload dos arquivos de importacao (CSV)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------- Carga inicial ----------
# Desligada: o esquema e os dados oficiais vem do repositorio thermocity-banco-de-dados (tabelas TMC_).
# CARGA_INICIAL=true so para uso local/teste: carrega os CSVs de src/main/resources/dados se o banco estiver vazio.
thermocity.carga-inicial.habilitada=${CARGA_INICIAL:false}

# ---------- Cadastro sintetico (PBI #6) ----------
# ATENCAO: valores PROVISORIOS. Substituir por fontes oficiais (ex.: Pesquisa Nacional de Saude/IBGE)
# antes de usar os numeros em qualquer apresentacao.
thermocity.sintetico.semente-padrao=42
thermocity.sintetico.probabilidade-feminino=0.5
thermocity.sintetico.taxa-mora-sozinho=0.15
thermocity.sintetico.taxa-mobilidade-reduzida=0.10
thermocity.sintetico.taxa-condicao-cronica=0.50

# ---------- Logs ----------
# O ID de rastreio (X-Request-Id) aparece entre colchetes em toda linha de log da requisição.
logging.pattern.level=%5p [%X{requestId:-}]
# LOG_LEVEL=DEBUG para ver mais detalhes da aplicação.
logging.level.br.com.thermocity=${LOG_LEVEL:INFO}
