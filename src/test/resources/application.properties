spring.application.name=base-territorial-api
# Testes usam H2 em memoria (modo PostgreSQL), sem depender de banco externo.
spring.datasource.url=jdbc:h2:mem:thermocity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
thermocity.carga-inicial.habilitada=true
thermocity.sintetico.semente-padrao=42
thermocity.sintetico.probabilidade-feminino=0.5
thermocity.sintetico.taxa-mora-sozinho=0.15
thermocity.sintetico.taxa-mobilidade-reduzida=0.10
thermocity.sintetico.taxa-condicao-cronica=0.50
# Origem do painel em desenvolvimento (o teste de CORS usa esta)
thermocity.cors.origens=http://localhost:5173
